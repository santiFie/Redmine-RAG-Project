[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "redmine-langgraph-rag"
version = "0.1.0"
description = "LangGraph agent with Redmine API and LlamaIndex RAG integration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Santiago Fierro", github = "santiFie" }]

dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langgraph-cli>=0.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.3.0",
    "fastmcp",
    "fastembed==0.8.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq==1.1.3",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "langchain-google-genai==4.3.4",
    "langgraph-checkpoint-postgres>=2.0.0",
    # LlamaIndex RAG
    "llama-index>=0.11.0",
    "llama-index-core>=0.11.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-llms-ollama>=0.3.0",
    "llama-index-llms-groq==0.5.0",
    "llama-index-llms-nvidia==0.5.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-embeddings-huggingface-api>=0.3.0",
    "llama-index-storage-docstore-postgres==0.5.0",
    "sentence-transformers<4.0.0",
    "transformers<5.0.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    # Guardrails
    "guardrails-ai>=0.10.2",
    # Redmine API REST
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Configuración
    "python-dotenv>=1.0.0",
    # Utilidades
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
ragas = [
    # Evaluación RAG con Ragas + integración LlamaIndex
    "ragas>=0.2.0",
    "llama-index-llms-groq>=0.3.0",
    "llama-index-embeddings-huggingface-api>=0.3.0",
    "pandas>=2.0.0",
]

[project.scripts]
# CLI para operaciones de ingesta y utilidades
# Uso: python -m redmine_rag ingest --project my-project
redmine-rag = "src.cli:app"  # TODO: implementar CLI con Typer

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ==============================================================================
# Ruff (linter + formatter)
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Reglas básicas: errores (E), advertencias estándar (W) y pyflakes (F)
# Se remueven 'SIM' (simplificaciones forzadas), 'UP' (modernizaciones agresivas) e 'I' (orden estricto de imports)
select = ["E", "F", "W"]
ignore = [
    "E501",  # Longitud de línea (manejada flexiblemente)
    "E402",  # Permite manipular sys.path antes de imports
    "E701",  # Permite múltiples declaraciones en una línea si es conveniente
    "B008",  # Permite Depends() de FastAPI en valores por defecto
    "F401",  # Permite imports no utilizados durante desarrollo/prototipado
    "W291",  # Trailing whitespace tolerante
    "W292",  # No newline at end of file tolerante
    "W293",  # Blank line whitespace tolerante
]

[tool.ruff.format]
quote-style = "double"

# ==============================================================================
# MyPy (type checking relajado para desarrollo ágil)
# ==============================================================================
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
follow_imports = "silent"
disable_error_code = ["typeddict-item", "no-any-return", "call-overload", "arg-type", "union-attr", "assignment"]

# ==============================================================================
# Pytest
# ==============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "ragas: tests de evaluación con Ragas (requieren Qdrant activo y APIs configuradas)",
    "integration: tests de integración que requieren docker-compose up -d (Qdrant, Postgres)",
    "smoke: tests de humo para validar levantamiento y salud de servicios en contenedores",
]
filterwarnings = [
    "ignore::DeprecationWarning:llama_index.*",
    "ignore::DeprecationWarning:ragas.*",
    "ignore::RuntimeWarning:ragas.*",
]
