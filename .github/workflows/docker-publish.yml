name: Docker Publish to GHCR

on:
    push:
        branches: [ main ]
        tags: [ 'v*.*.*' ]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: bff
                      context: ./bff
                      dockerfile: bff/Dockerfile
                      image: ghcr.io/${{ github.repository }}/bff
                    - name: ui
                      context: ./ui
                      dockerfile: ui/Dockerfile
                      image: ghcr.io/${{ github.repository }}/ui
                    - name: langgraph
                      context: .
                      dockerfile: langgraph_api/Dockerfile
                      image: ghcr.io/${{ github.repository }}/langgraph_api
                    # El resto de los servicios no es necesario ponerlos aca porque ya tienen imagenes publicas (ej: postgres:16-alpine)
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4 # Clona el código fuente en el dir de trabajo del servidor

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3 # Instala y configura el builder de docker
            
            - name: Log in to Github Container Registry
              uses: docker/login-action@v3 # Maneja el login y logout del registry
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }} 
            
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5 # Extrae y genera tags y metadatos(labels)
              with:
                images: ${{ matrix.image }}
                tags: |
                  type=ref,event=branch
                  type=semver,pattern={{version}}
                  type=sha,format=short
                  type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                context: ${{ matrix.context }}
                file: ${{ matrix.dockerfile }}
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
